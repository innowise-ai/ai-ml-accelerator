schema_version: "1.1"
name: 04-audit-accuracy-under-imbalance
description: >
  A judge with a headline 91% accuracy that catches 1 failure out of 10, hidden by a 90/10 class
  split. The number is real and the conclusion drawn from it is wrong. A bare model usually
  accepts 91% as evidence the judge works and suggests raising the bar to 95%.
tags: [eval-audit, tpr-tnr, class-imbalance]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    Our LLM judge reports 91% accuracy against human labels, so we stopped doing manual spot checks.
    The labelled data and the scoring script are in this directory.
    Is that judge safe to trust? Audit it.
  max_turns: 25
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

expected_outcome: >
  The answer refuses the 91% figure, explains that raw accuracy and percent agreement are
  meaningless under a 90/10 class split, computes or demands TPR and TNR separately, and points out
  that this judge misses almost every actual failure.
