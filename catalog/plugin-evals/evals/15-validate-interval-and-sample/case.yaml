schema_version: "1.1"
name: 15-validate-interval-and-sample
description: >
  A corrected point estimate from a 40-example test set, about to be quoted to a board. Two things
  are wrong and only one is visible: the missing interval, and the test set being well under the
  size where the interval stays narrow. A bare model congratulates the correction and moves on.
tags: [validate-evaluator, confidence-interval, sample-size]

execution:
  prompt: |
    We validated our judge on a held-out test set of 40 labelled traces and applied the bias
    correction: production pass rate comes out at 85%.

    That number goes in the board deck on Thursday. Anything I should add?
  max_turns: 12
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

expected_outcome: >
  The answer requires a confidence interval alongside the 85%, explains that a point estimate alone
  cannot be acted on, and flags that 40 test examples is below the size where the interval stays
  usefully narrow.
