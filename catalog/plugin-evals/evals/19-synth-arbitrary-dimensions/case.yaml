schema_version: "1.1"
name: 19-synth-arbitrary-dimensions
description: >
  The user brings dimensions that look methodical and target nothing: browser and day of week
  cannot change what the model does. Following the structure with useless axes burns the whole test
  budget on variation that carries no failure signal. A bare model generates the 30 cases as asked.
tags: [generate-synthetic-data, pushback, failure-targeted]

execution:
  prompt: |
    Here are our three dimensions for the travel-booking bot:
      - query length: short / medium / long
      - day of week: Mon through Sun
      - user's browser: Chrome / Safari / Firefox

    Generate 30 test cases from these.
  max_turns: 14
  timeout_seconds: 480
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

expected_outcome: >
  The answer pushes back before generating: browser and day of week do not reach the model at all,
  so they cannot produce a failure. It asks where the bot actually breaks and proposes replacement
  axes tied to plausible failure modes.
