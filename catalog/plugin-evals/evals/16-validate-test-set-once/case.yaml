schema_version: "1.1"
name: 16-validate-test-set-once
description: >
  The user proposes tuning against the test set until both rates clear 0.90 — a plan that destroys
  the only unbiased estimate they have, stated confidently enough that agreeing is the path of
  least resistance. A bare model tends to help optimise the loop it was handed.
tags: [validate-evaluator, holdout-discipline, pushback]

execution:
  prompt: |
    Judge hit TPR 0.86 and TNR 0.79 on the test set. Plan: tighten the Fail definition, re-run on
    the test set, repeat until both are above 0.90, then ship.

    Sanity-check the plan for me.
  max_turns: 12
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

expected_outcome: >
  The plan is rejected: iterating against the test set turns it into a training set and the final
  numbers stop being an unbiased estimate. Iteration belongs on the dev set, driven by inspecting
  disagreements; the test set is measured once. TNR 0.79 is also below the acceptable floor.
