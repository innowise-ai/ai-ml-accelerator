schema_version: "1.1"
name: 07-audit-greenfield-no-evals
description: >
  No eval infrastructure at all, but 6k real request/response pairs in the log. The plugin's rule
  for this state is explicit: do not recommend building evaluators, judges or dashboards before
  error analysis. A bare model answers with the standard three-step plan — define metrics, build an
  LLM judge, wire up a dashboard — which is exactly the wrong order.
tags: [eval-audit, greenfield, error-analysis-first]

context:
  scaffold_script: scaffold.sh

execution:
  prompt: |
    We have no evals at all for this service, and the next release is in three weeks.
    Give me the concrete build order. What do we build first, second, third?
  max_turns: 25
  timeout_seconds: 700
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

expected_outcome: >
  The first item is error analysis over a sample of the 6k logged pairs, producing named failure
  modes. Evaluators, judges and dashboards appear only after that, explicitly conditioned on the
  failure modes the review turns up.
