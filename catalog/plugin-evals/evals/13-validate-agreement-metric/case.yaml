schema_version: "1.1"
name: 13-validate-agreement-metric
description: >
  "The judge agrees with us 88% of the time" is the number teams reach for and the one that cannot
  be acted on. It has to be decomposed into agreement on the Pass cases and agreement on the Fail
  cases, because only those two feed the bias correction later. A bare model usually validates the
  88% and suggests Cohen's Kappa as the more rigorous version of the same mistake.
tags: [validate-evaluator, tpr-tnr]

execution:
  prompt: |
    Our LLM judge agrees with our human labels 88% of the time.
    Is that good? What should we actually be reporting instead, and why that?
  max_turns: 12
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Skill]

runs: 3

expected_outcome: >
  Percent agreement is rejected as uninformative on its own; the answer requires the two per-class
  rates — agreement over human-Pass cases and over human-Fail cases — explains that imbalance makes
  a single figure misleading, and notes those two rates are what later bias correction consumes.
